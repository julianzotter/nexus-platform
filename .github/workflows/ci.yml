name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python -m unittest discover -s tests
      - run: python tools/validate_registry.py
      - run: python tools/validate_knowledge.py

      - name: CPLM local invariants
        run: |
          pip install -r cplm-implementation/requirements.txt
          PYTHONPATH=cplm-implementation python -m unittest discover -s cplm-implementation/tests -v
