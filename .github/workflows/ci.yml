name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema pytest
      - run: python -m unittest discover -s tests
      - run: python tools/validate_registry.py
      # Development gate: --allow-empty tolerates an unpopulated inventory (NO_DATA is reported, never PASS).
      # The release gate is: python tools/knowledge_health.py --strict
      - run: python tools/validate_knowledge.py --allow-empty
      - run: python tools/knowledge_health.py --allow-empty

      - name: Orchestrator tests
        run: PYTHONPATH=orchestrator python -m pytest orchestrator/tests -q

      - name: CPLM local invariants
        run: |
          pip install -r cplm-implementation/requirements.txt
          PYTHONPATH=cplm-implementation python -m unittest discover -s cplm-implementation/tests -v
