name: NEXUS Monitor
on:
  schedule:
    - cron: "17 * * * *"   # hourly stabilization at :17 UTC; scheduled runs may be delayed; Actions usage only
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: nexus-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate and report repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/monitor_repo.py
      - name: Assert operational monitor evidence (fail closed)
        if: ${{ always() }}
        run: python tools/assert_operational_evidence.py monitor reports/monitor/report.json

      - name: Export commit-bound dashboard snapshot
        if: ${{ always() }}
        run: python tools/export_dashboard.py --source-commit "$GITHUB_SHA"

      - name: Build Control Panel data (control-data.json, deterministic)
        if: ${{ always() }}
        run: python tools/build_control_data.py --source-commit "$GITHUB_SHA"

      - name: Skill and agent inventory (read-only)
        if: ${{ always() }}
        run: python tools/skill_inventory.py

      - name: Advisory LLM analysis of monitor findings
        if: ${{ always() }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          NEXUS_LLM_EXPORT_APPROVED: ${{ vars.NEXUS_LLM_EXPORT_APPROVED }}
        run: python tools/monitor_llm.py

      - name: Preserve monitoring evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: nexus-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/monitor/
            reports/skills/
            apps/control-panel/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize failure recovery
        if: ${{ failure() }}
        run: |
          echo '### Recovery' >> "$GITHUB_STEP_SUMMARY"
          echo 'The monitor failed its repository checks or its evidence gate. Review the failed step and compare with CI for the same commit.' >> "$GITHUB_STEP_SUMMARY"
          echo "See [Actions recovery](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/operations/actions-recovery.md)." >> "$GITHUB_STEP_SUMMARY"
