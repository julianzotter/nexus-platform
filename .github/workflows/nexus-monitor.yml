name: NEXUS Monitor
on:
  schedule:
    - cron: "17 5 * * *"   # daily at 05:17 UTC; scheduled runs may be delayed (credit-saving)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: nexus-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate and report repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/monitor_repo.py
      - name: Skill and agent inventory (read-only)
        run: python tools/skill_inventory.py

      - name: Preserve monitoring evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: nexus-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/monitor/
            reports/skills/
          if-no-files-found: error
          retention-days: 30
