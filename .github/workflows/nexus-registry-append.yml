name: NEXUS Registry Append
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Legacy ID06 batch reference; executes the reviewed canonical control-register repair
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nexus-drive-canonical-writer
  cancel-in-progress: false
jobs:
  append:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate plan path
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          [[ "$PLAN" == 'registry/pending/2026-11-16_ID06_registry-append.json' && -f "$PLAN" ]] || exit 2
          echo "PLAN=$PLAN" >> "$GITHUB_ENV"
      - name: Conditional repair via canonical reviewed plan (legacy entrypoint)
        env:
          NEXUS_GOOGLE_CLIENT_ID: ${{ secrets.NEXUS_GOOGLE_CLIENT_ID }}
          NEXUS_GOOGLE_CLIENT_SECRET: ${{ secrets.NEXUS_GOOGLE_CLIENT_SECRET }}
          NEXUS_GOOGLE_REFRESH_TOKEN: ${{ secrets.NEXUS_GOOGLE_REFRESH_TOKEN }}
        run: python tools/repair_control_registers.py --apply
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: registry-append-result
          path: reports/control-repair/
          if-no-files-found: warn
