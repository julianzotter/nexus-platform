# mail-harvester accounts — copy to accounts.toml and adjust.
# Passwords live ONLY in environment variables named below (see secrets.env.example).
# Verified 2026: World4You IMAP = imap.world4you.com:993 (SSL); Gmail = imap.gmail.com:993.
# `folders` is optional; if omitted, ALL folders of the mailbox are synced.

[[account]]
name = "zotterconsult"
host = "imap.world4you.com"
port = 993
user = "office@zotterconsult.at"
password_env = "MAIL_PASS_ZOTTERCONSULT"
# folders = ["INBOX", "INBOX.Sent"]

