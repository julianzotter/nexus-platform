name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-offline-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Windows PowerShell 5.1 diagnostic behaviour
        shell: powershell
        run: .\tests\windows\test_drive_offline_check.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: P2 local reports and exit codes on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\test_verify_nexus_sync_p2.ps1
      - name: P2 local reports and exit codes on PowerShell 7
        shell: pwsh
        run: .\tests\windows\test_verify_nexus_sync_p2.ps1
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # Dashboard fixtures refer to historical revisions and verify ancestry.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema pytest
      - run: python -m pytest -q tests
      - name: Report naming gate (YY_MM_DD_HHMM_ID##_THEMA_###, files added in this PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/naming_gate.py --base "origin/$BASE_REF"
      - name: Report ID ledger (registry/report-ledger.jsonl) consistent with numbered files
        run: python tools/report_ledger.py check
      - name: Role matrix and panel roles rendered from role_capability_matrix.json
        run: python tools/render_role_matrix.py --check
      - name: Artifact registry fail-closed tests
        run: python -m pytest -q tests/test_artifact_registry_gate.py
      - run: python tools/validate_registry.py
      - name: Claude.ai skill snapshot integrity (SHA-256 manifest)
        run: cd skills/claude-ai && sha256sum -c --quiet MANIFEST.sha256
      # Structure report only; INVALID packages are reported, not gated, until frontmatter is aligned.
      - run: python tools/skill_inventory.py --out "$RUNNER_TEMP/skill-inventory"
      - name: Fail on duplicate skill IDs
        run: |
          python - <<'PY'
          import json, os, sys
          r = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "skill-inventory", "skill-inventory.json")))
          print("duplicate_ids:", r["duplicate_ids"])
          sys.exit(1 if r["duplicate_ids"] else 0)
          PY
      # Inventory is not populated yet; report NO_DATA rather than claim PASS.
      - run: python tools/validate_knowledge.py --allow-empty
      - run: python tools/knowledge_health.py --allow-empty

      - name: CPLM local invariants
        run: |
          pip install -r cplm-implementation/requirements.txt
          PYTHONPATH=cplm-implementation python -m unittest discover -s cplm-implementation/tests -v

      - name: PR69 skill packages structure and hashes
        run: |
          python tools/skill_inventory.py --strict --strict-scope authoring --out "$RUNNER_TEMP/pr69-skill-inventory"
          cat "$RUNNER_TEMP/pr69-skill-inventory/skill-inventory.md" >> "$GITHUB_STEP_SUMMARY"
          sha256sum skills/*/SKILL.md >> "$GITHUB_STEP_SUMMARY"

