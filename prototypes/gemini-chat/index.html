<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Gemini-Chat</title>
<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fdfdfc;--surface-2:#eeede9;--line:#dcdad4;--text:#121212;--text-2:#55534e;--muted:#7a7870;
  --accent:#2a78d6;--user:#e3edfb;--bad:#c23b3a;--bad-soft:#fbe6e5;--warn:#9a6a00;--warn-soft:#fbf1dc;--code:#f1f0ec}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface-2:#252523;--line:#37362f;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#97958c;--accent:#3987e5;--user:#1d2b40;--bad:#ef7d7c;--bad-soft:#3b1f1e;--warn:#e3b24f;--warn-soft:#382d16;--code:#222220}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface-2:#252523;--line:#37362f;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#97958c;--accent:#3987e5;--user:#1d2b40;--bad:#ef7d7c;--bad-soft:#3b1f1e;--warn:#e3b24f;--warn-soft:#382d16;--code:#222220}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:16px;margin:0 auto 0 0;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.ok{background:#2f9e44}.dot.busy{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.btn,select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.btn{cursor:pointer;white-space:nowrap}.btn:hover{background:var(--surface-2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.banner{margin:12px auto 0;max-width:860px;width:calc(100% - 32px);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px}
.banner code{background:transparent;font-weight:600}
.settings{max-width:860px;width:calc(100% - 32px);margin:12px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center;font-size:13.5px}
.settings[hidden]{display:none}
.settings textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);resize:vertical}
.settings small{color:var(--muted);grid-column:2}
@media (max-width:600px){.settings{grid-template-columns:1fr}.settings small{grid-column:1}}
main{flex:1;overflow:auto}
#msgs{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:6px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .who{font-size:12px;color:var(--muted)}
.msg.user{align-items:flex-end}
.bubble{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user);border-color:transparent;white-space:pre-wrap}
.bubble.err{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.imgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.imgs img{max-width:220px;max-height:180px;border-radius:10px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in}
.meta{font-size:11.5px;color:var(--muted)}
.caret::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}
.bubble pre{background:var(--code);border-radius:8px;padding:10px;overflow:auto;font-size:13px;margin:8px 0}
.bubble code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:var(--code);padding:1px 4px;border-radius:4px}
.bubble pre code{background:none;padding:0}
.bubble ul,.bubble ol{margin:4px 0 8px;padding-left:22px}
.bubble h3,.bubble h4{margin:10px 0 6px;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.empty button{margin:4px}
footer{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px}
.composer{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.att{display:flex;gap:8px;flex-wrap:wrap}
.att figure{margin:0;position:relative}
.att img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.att button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--text);color:var(--bg);cursor:pointer;font-size:12px;line-height:1}
.row{display:flex;gap:8px;align-items:flex-end}
textarea#input{flex:1;resize:none;max-height:200px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.hint{font-size:11.5px;color:var(--muted)}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:none;place-items:center;font-size:20px;font-weight:700;z-index:20}
.drop.on{display:grid}
dialog{border:0;padding:0;background:transparent;max-width:95vw;max-height:95vh}dialog img{max-width:95vw;max-height:90vh;border-radius:10px}
dialog::backdrop{background:rgba(0,0,0,.7)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="status" aria-hidden="true"></span>NEXUS Gemini-Chat</h1>
  <label class="hint" for="model">Modell</label><select id="model"></select>
  <button class="btn" id="toggleSettings" aria-expanded="false" aria-controls="settings">⚙ Einstellungen</button>
  <button class="btn" id="exportMd">Export MD</button><button class="btn" id="exportJson">JSON</button>
  <button class="btn" id="newChat">+ Neuer Chat</button>
  <button class="btn" id="theme" aria-label="Farbschema wechseln">◐</button>
</header>
<div class="banner" id="banner" hidden></div>
<section class="settings" id="settings" hidden aria-label="Modellparameter">
  <label for="system">Systemanweisung</label><textarea id="system" placeholder="z. B. Antworte als Tragwerksplaner knapp auf Deutsch und nenne Annahmen."></textarea>
  <label for="customModel">Eigene Modell-ID</label><input type="text" id="customModel" placeholder="leer = Auswahl oben">
  <label for="maxTokens">Max. Ausgabe-Tokens</label><input type="number" id="maxTokens" min="1" max="65536" step="1" placeholder="Standard des Modells">
  <label for="temp"><input type="checkbox" id="useTemp"> Temperatur</label><input type="number" id="temp" min="0" max="2" step="0.1" value="1" disabled>
  <small>Laut Gemini-Doku ignorieren Gemini 3.6+ und Gemini 4 die Temperatur. Sie wird nur gesendet, wenn aktiviert.</small>
</section>
<main id="scroller"><div id="msgs" aria-live="polite"></div></main>
<footer>
  <form class="composer" id="form">
    <div class="att" id="att"></div>
    <div class="row">
      <label class="btn" title="Bilder anhängen (PNG, JPEG, WebP, HEIC)" aria-label="Bilder anhängen">🖼<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" multiple hidden></label>
      <textarea id="input" rows="1" placeholder="Nachricht … (Enter senden, Umschalt+Enter neue Zeile, Bilder einfügen oder hineinziehen)" aria-label="Nachricht"></textarea>
      <button class="btn primary" id="send">Senden</button>
    </div>
    <div class="hint" id="hint"></div>
  </form>
</footer>
<div class="drop" id="drop">Bilder hier ablegen</div>
<dialog id="viewer"><img alt=""></dialog>

<script>
'use strict';
const $ = s => document.querySelector(s);
const MAX_IMAGES = 4, MAX_EDGE = 1600;
const S = {config: null, session: null, turns: [], pending: [], abort: null};
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v != null && v !== false) e.setAttribute(k, v); }
  kids.flat().forEach(c => e.append(c?.nodeType ? c : document.createTextNode(c ?? '')));
  return e;
}
const store = {get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }};
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).toLowerCase();

/* ---------- safe markdown: builds DOM nodes, never innerHTML ---------- */
function inline(text) {
  const out = []; const re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*\s][^*]*\*)|(\[[^\]]+\]\((https?:\/\/[^\s)]+)\))/g; let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1]) out.push(h('code', {}, m[1].slice(1, -1)));
    else if (m[2]) out.push(h('strong', {}, m[2].slice(2, -2)));
    else if (m[3]) out.push(h('em', {}, m[3].slice(1, -1)));
    else out.push(h('a', {href: m[5], target: '_blank', rel: 'noopener noreferrer'}, m[4].slice(1, m[4].indexOf(']'))));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function markdown(src) {
  const frag = document.createDocumentFragment(), lines = src.split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++;
      frag.append(h('pre', {}, h('code', {}, buf.join('\n')))); continue; }
    const hd = /^(#{1,4})\s+(.*)/.exec(l);
    if (hd) { frag.append(h(hd[1].length <= 2 ? 'h3' : 'h4', {}, inline(hd[2]))); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l), list = h(ordered ? 'ol' : 'ul');
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) list.append(h('li', {}, inline(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ''))));
      frag.append(list); continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^```|^#{1,4}\s|^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) para.push(lines[i++]);
    const p = h('p'); para.forEach((x, j) => { if (j) p.append(h('br')); p.append(...inline(x)); }); frag.append(p);
  }
  return frag;
}

/* ---------- rendering ---------- */
const scroller = $('#scroller');
const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120;
const toBottom = () => scroller.scrollTo({top: scroller.scrollHeight});
function imgEl(src) { const i = h('img', {src, alt: 'Angehängtes Bild', loading: 'lazy'}); i.addEventListener('click', () => { $('#viewer img').src = src; $('#viewer').showModal(); }); return i; }
function renderTurn(t) {
  const isUser = t.role === 'user', box = h('div', {class: 'msg ' + (isUser ? 'user' : 'model')});
  box.append(h('div', {class: 'who'}, isUser ? 'Du' : (t.model || 'Gemini'), t.at ? ' · ' + new Date(t.at).toLocaleTimeString('de-DE') : ''));
  const imgs = (t.parts || []).filter(p => p.inline_data);
  if (imgs.length) box.append(h('div', {class: 'imgs'}, imgs.map(p => imgEl(`data:${p.inline_data.mime_type};base64,${p.inline_data.data}`))));
  const text = (t.parts || []).filter(p => typeof p.text === 'string').map(p => p.text).join('');
  if (text || !isUser) { const b = h('div', {class: 'bubble'}); isUser ? b.append(text) : b.append(markdown(text)); box.append(b); }
  if (!isUser) box.append(h('div', {class: 'meta'}, metaText(t)));
  return box;
}
function metaText(t) {
  const u = t.usage || {};
  return [t.finishReason && t.finishReason !== 'STOP' ? 'Ende: ' + t.finishReason : null,
    u.promptTokenCount != null ? `Tokens: ${u.promptTokenCount} ein · ${u.candidatesTokenCount ?? 0} aus${u.thoughtsTokenCount ? ' · ' + u.thoughtsTokenCount + ' Denken' : ''}` : null].filter(Boolean).join(' · ');
}
function renderAll() {
  const m = $('#msgs'); m.replaceChildren();
  if (!S.turns.length) m.append(h('div', {class: 'empty'}, h('p', {}, 'Schreib eine Nachricht oder hänge Bilder an.'),
    ...['Was zeigt dieses Bild?', 'Erkläre den Knicknachweis nach EN 1995 in 5 Punkten.', 'Lies die Maße aus der Skizze und liste sie als Tabelle.']
      .map(x => h('button', {class: 'btn', type: 'button', onclick: () => { $('#input').value = x; $('#input').focus(); autosize(); }}, x))));
  S.turns.forEach(t => m.append(renderTurn(t)));
  toBottom();
}

/* ---------- attachments ---------- */
async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|heic|heif)$/.test(file.type)) throw new Error(`${file.name}: Format ${file.type || 'unbekannt'} nicht unterstützt`);
  if (/heic|heif/.test(file.type)) { // browsers cannot decode HEIC on a canvas: send unchanged
    if (file.size > 6 * 1048576) throw new Error(`${file.name}: größer als 6 MB`);
    return {mime: file.type, data: await b64(file), preview: null, name: file.name};
  }
  const bmp = await createImageBitmap(file), scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size <= 1.5 * 1048576) return {mime: file.type, data: await b64(file), preview: URL.createObjectURL(file), name: file.name};
  const c = new OffscreenCanvas(Math.round(bmp.width * scale), Math.round(bmp.height * scale));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await c.convertToBlob({type: 'image/jpeg', quality: .86});
  return {mime: 'image/jpeg', data: await b64(blob), preview: URL.createObjectURL(blob), name: file.name};
}
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
async function addFiles(files) {
  for (const f of files) {
    if (S.pending.length >= MAX_IMAGES) { hint(`Höchstens ${MAX_IMAGES} Bilder pro Nachricht.`); break; }
    try { S.pending.push(await prepareImage(f)); } catch (e) { hint(e.message); }
  }
  renderAttachments();
}
function renderAttachments() {
  $('#att').replaceChildren(...S.pending.map((p, i) => h('figure', {}, p.preview ? h('img', {src: p.preview, alt: p.name}) : h('div', {class: 'hint'}, p.name),
    h('button', {type: 'button', 'aria-label': 'Bild entfernen', onclick: () => { S.pending.splice(i, 1); renderAttachments(); }}, '×'))));
}
const hint = t => { $('#hint').textContent = t; };

/* ---------- streaming chat ---------- */
function cfg() {
  const custom = $('#customModel').value.trim(), max = parseInt($('#maxTokens').value, 10);
  return {model: custom || $('#model').value, system: $('#system').value,
          maxOutputTokens: Number.isFinite(max) ? max : undefined, temperature: $('#useTemp').checked ? parseFloat($('#temp').value) : undefined};
}
async function send() {
  const text = $('#input').value, images = S.pending;
  if (S.abort || (!text.trim() && !images.length)) return;
  const userTurn = {role: 'user', at: new Date().toISOString(), parts: [...images.map(p => ({inline_data: {mime_type: p.mime, data: p.data}})), ...(text.trim() ? [{text}] : [])]};
  if (!S.turns.length) $('#msgs').replaceChildren();
  $('#msgs').append(renderTurn(userTurn));
  $('#input').value = ''; S.pending = []; renderAttachments(); autosize();
  const box = h('div', {class: 'msg model'}), who = h('div', {class: 'who'}, cfg().model), bubble = h('div', {class: 'bubble caret'}), meta = h('div', {class: 'meta'});
  box.append(who, bubble, meta); $('#msgs').append(box); toBottom();
  setBusy(true);
  S.abort = new AbortController();
  let acc = '', done = null, failed = null, frame = 0;
  const paint = () => { frame = 0; const stick = nearBottom(); bubble.replaceChildren(markdown(acc)); if (stick) toBottom(); };
  try {
    const res = await fetch(`/api/sessions/${S.session}/chat`, {method: 'POST', signal: S.abort.signal, headers: {'content-type': 'application/json'},
      body: JSON.stringify({message: {text, images: images.map(p => ({mime: p.mime, data: p.data}))}, config: cfg()})});
    if (!res.ok || !res.headers.get('content-type')?.includes('text/event-stream')) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {value, done: end} = await reader.read(); if (end) break;
      buf += dec.decode(value, {stream: true}); let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(block)?.[1], data = JSON.parse(/^data: (.*)$/m.exec(block)?.[1] || '{}');
        if (ev === 'start') who.textContent = data.model;
        if (ev === 'delta') { acc += data.text; if (!frame) frame = requestAnimationFrame(paint); }
        if (ev === 'done') done = data;
        if (ev === 'error') failed = data.error;
      }
    }
    if (!done && !failed) failed = 'Stream ohne Abschluss beendet.';
  } catch (e) { failed = e.name === 'AbortError' ? 'Abgebrochen.' : e.message; }
  cancelAnimationFrame(frame); paint(); bubble.classList.remove('caret'); setBusy(false); S.abort = null;
  if (done) {
    const t = {role: 'model', parts: [{text: acc}], at: new Date().toISOString(), model: done.model, finishReason: done.finishReason, usage: done.usage};
    S.turns.push(userTurn, t); meta.textContent = metaText(t); who.textContent = `${done.model} · ${new Date().toLocaleTimeString('de-DE')}`;
  } else {
    // the server stores a turn only after a complete answer: restore the draft so it can be resent
    bubble.classList.add('err'); bubble.replaceChildren(failed + ' Die Nachricht wurde nicht im Verlauf gespeichert und steht wieder im Eingabefeld.');
    if (acc) bubble.prepend(h('div', {class: 'meta'}, 'Teilantwort verworfen.'));
    $('#input').value = text; S.pending = images; renderAttachments(); autosize();
  }
}
function setBusy(b) {
  $('#status').className = 'dot ' + (b ? 'busy' : S.config?.hasKey ? 'ok' : '');
  const s = $('#send'); s.textContent = b ? '■ Stopp' : 'Senden'; s.className = 'btn ' + (b ? 'stop' : 'primary');
}

/* ---------- session, export, settings ---------- */
async function loadSession(id) {
  S.session = id; store.set('nexus-gemini-session', id);
  try { const r = await fetch(`/api/sessions/${id}`); S.turns = r.ok ? (await r.json()).turns || [] : []; } catch { S.turns = []; }
  renderAll();
}
function exportChat(kind) {
  const name = `gemini_chat_${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}`;
  const text = kind === 'json' ? JSON.stringify({session: S.session, turns: S.turns}, null, 1)
    : ['# NEXUS Gemini-Chat', '', ...S.turns.map(t => `## ${t.role === 'user' ? 'Du' : t.model || 'Gemini'} (${t.at || ''})\n\n` +
        t.parts.map(p => p.text ?? `_[Bild ${p.inline_data.mime_type}]_`).join('\n\n'))].join('\n\n');
  const a = h('a', {href: URL.createObjectURL(new Blob([text], {type: kind === 'json' ? 'application/json' : 'text/markdown;charset=utf-8'})), download: `${name}.${kind === 'json' ? 'json' : 'md'}`});
  document.body.append(a); a.click(); a.remove();
}
const autosize = () => { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(200, t.scrollHeight) + 'px'; };
for (const id of ['system', 'customModel', 'maxTokens', 'temp']) {
  const el = $('#' + id), v = store.get('nexus-gemini-' + id); if (v != null) el.value = v;
  el.addEventListener('change', () => store.set('nexus-gemini-' + id, el.value));
}
$('#useTemp').checked = store.get('nexus-gemini-useTemp') === '1'; $('#temp').disabled = !$('#useTemp').checked;
$('#useTemp').addEventListener('change', e => { $('#temp').disabled = !e.target.checked; store.set('nexus-gemini-useTemp', e.target.checked ? '1' : '0'); });
$('#model').addEventListener('change', e => store.set('nexus-gemini-model', e.target.value));
$('#toggleSettings').addEventListener('click', e => { const s = $('#settings'); s.hidden = !s.hidden; e.currentTarget.setAttribute('aria-expanded', !s.hidden); });
$('#form').addEventListener('submit', e => { e.preventDefault(); S.abort ? S.abort.abort() : send(); });
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#input').addEventListener('input', autosize);
$('#input').addEventListener('paste', e => { const f = [...e.clipboardData.files].filter(x => x.type.startsWith('image/')); if (f.length) { e.preventDefault(); addFiles(f); } });
$('#file').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
let depth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer?.types.includes('Files')) { depth++; $('#drop').classList.add('on'); } });
addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); depth = 0; $('#drop').classList.remove('on'); addFiles([...e.dataTransfer.files]); });
$('#newChat').addEventListener('click', () => { if (S.abort) S.abort.abort(); loadSession(newId()); });
$('#exportMd').addEventListener('click', () => exportChat('md'));
$('#exportJson').addEventListener('click', () => exportChat('json'));
$('#viewer').addEventListener('click', () => $('#viewer').close());
$('#theme').addEventListener('click', () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; store.set('nexus-gemini-theme', r.dataset.theme); });
if (store.get('nexus-gemini-theme')) document.documentElement.dataset.theme = store.get('nexus-gemini-theme');

(async () => {
  try { S.config = await (await fetch('/api/config')).json(); }
  catch { S.config = {hasKey: false, models: [], unreachable: true}; }
  const saved = store.get('nexus-gemini-model');
  $('#model').replaceChildren(...(S.config.models || []).map(m => h('option', {value: m, selected: m === (saved || S.config.defaultModel) || null}, m)));
  if (!S.config.hasKey) {
    const b = $('#banner'); b.hidden = false;
    b.append(S.config.unreachable ? 'Server nicht erreichbar. Starte ihn mit ' : 'Kein API-Key auf dem Server. Beenden, Key setzen und neu starten: ',
      h('code', {}, '$env:GEMINI_API_KEY="…"; node prototypes/gemini-chat/server.mjs'), ' – der Key bleibt im Serverprozess.');
  }
  setBusy(false);
  const id = store.get('nexus-gemini-session');
  await loadSession(id && /^[a-z0-9-]{8,64}$/.test(id) ? id : newId());
  $('#input').focus();
})();
</script>
</body>
</html>
