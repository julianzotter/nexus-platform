[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-aec-contracts"
version = "0.1.0"
description = "Project-neutral AEC contracts, ports and fail-closed software validation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qa = ["pytest>=8,<10", "jsonschema>=4,<5", "mypy>=1.10,<2", "import-linter>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

